name: Release Mod

on:
  push:
    tags:
      - "v*"

jobs:
  github-release:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            16
            17
            21
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build "-Dorg.gradle.jvmargs=-Xmx12G -Dfile.encoding=UTF-8" -Porg.gradle.java.installations.fromEnv=JAVA_HOME_16_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
