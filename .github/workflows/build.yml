name: Java CI with Gradle

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main']

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            16
            17
            21
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build "-Dorg.gradle.jvmargs=-Xmx12G -Dfile.encoding=UTF-8" -Porg.gradle.java.installations.fromEnv=JAVA_HOME_16_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: effortless
          path: build/libs/*.jar
